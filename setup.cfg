[mutmut]
paths_to_mutate=bin/notarise.py
# Scope the runner to the two notarise suites only. mutmut runs this exact
# command for both the baseline and every mutant; collecting the whole
# tests/ tree from mutants/ pulls in unrelated modules (test_demo imports a
# sibling `demo` package that is not importable from the copied tree) and
# fails baseline. `python -m pytest` resolves to whichever interpreter
# invokes mutmut — no dependency on a gitignored venv path.
runner=DONNA_NOTARISE_KEY=test-key-donna-unit-2026-abc123xyz python -m pytest tests/test_notarise.py tests/test_notarise_mutations.py -x -q 2>&1
debug=true
